# ============================================================
# MS-STUDENTS - UniRemington
# Puerto local por defecto: 18082
# Puerto oficial del PDF: 8082
# ============================================================

server:
  port: ${MS_STUDENTS_PORT:18082}

spring:
  application:
    name: ms-students

  # ============================================================
  # BASE DE DATOS H2 EN MEMORIA
  # ============================================================
  datasource:
    url: jdbc:h2:mem:studentsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ============================================================
  # CONSOLA H2 (sólo desarrollo)
  # ============================================================
  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    loadbalancer:
      cache:
        ttl: 5s

# ============================================================
# CONFIGURACION DEL CLIENTE EUREKA
# ============================================================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:18761/eureka/}
  instance:
    prefer-ip-address: true

# ============================================================
# OPENFEIGN - tiempos de espera y compresión
# ============================================================
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# ============================================================
# OPENAPI / SWAGGER
# Documentación expuesta en:
#   - http://localhost:18082/swagger-ui.html
#   - http://localhost:18082/api-docs
# ============================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ============================================================
# ACTUATOR
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    com.uniremington.students: INFO
    org.hibernate.SQL: INFO
